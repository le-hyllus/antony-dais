{% extends 'base.html' %}
{% block title %}Todo List{% endblock %}

{% block content %}
<h1>Todo List</h1>

<form class="add" action="{{ url_for('add_todo') }}" method="post">
    <input type="text" name="task" placeholder="Add a new task" required>
    <button type="submit">Add</button>
</form>

{% if todos %}
<ul>
    {% for item in todos %}
    <li class="{{ 'done' if item.done }}">
        <span class="task">{{ item.task }}</span>

        <form action="{{ url_for('toggle_todo', todo_id=item.id) }}" method="post">
            <button class="ghost" type="submit">{{ 'Undo' if item.done else 'Done' }}</button>
        </form>

        <a class="btn ghost" href="{{ url_for('edit_todo', todo_id=item.id) }}">Edit</a>

        <form action="{{ url_for('delete_todo', todo_id=item.id) }}" method="post">
            <button class="danger" type="submit">Delete</button>
        </form>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="empty">No tasks yet. Add one above.</p>
{% endif %}
{% endblock %}
